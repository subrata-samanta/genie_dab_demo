# =============================================================================
# THE ONLY FILE YOU EDIT when you clone this repository for a new Genie space.
# Everything else - workflows, scripts, tests - is the same for every space.
#
# After editing, run:  databricks bundle validate -t dev
# Then: Actions -> 1 - Bootstrap, with the id of the dev space to adopt.
#
# NOT here, on purpose:
#   * which workspace, and which service principal the pipeline runs as. Those are an identity per
#     environment, not per space, so they live in GitHub: Settings -> Environments -> dev / qa / prod,
#     as DATABRICKS_HOST and DATABRICKS_CLIENT_ID (and the DATABRICKS_CLIENT_SECRET secret, if you are
#     not using workload identity federation). Locally they come from your CLI profile instead.
#   * grants, group membership and row-filter groups for that principal. See README, "One-time setup".
# =============================================================================

bundle:
  # Unique per space: names the deployment folder and the state Databricks keeps.
  # Changing it later makes Databricks forget the space it adopted, so pick once.
  name: genie-dab-demo

variables:
  # ---- the space itself -----------------------------------------------------
  space_title:
    description: "Title of the space. The environment suffix below is appended to it."
    default: "FreshCart Sales & Stock Assistant"
  space_description:
    description: "One line, shown under the title in the Genie list."
    default: "Ask about sales, margin, baskets, promotions and stock across FreshCart stores and online."

  # ---- where it runs --------------------------------------------------------
  warehouse_name:
    description: "SQL warehouse the space runs on, looked up by name in each workspace."
    default: "Serverless Starter Warehouse"

  # ---- the data -------------------------------------------------------------
  dev_catalog:
    description: >-
      Catalog the dev space reads. Must match the catalog in src/*.geniespace.json, which is exported
      from dev; scripts/set_catalog.sh rewrites it to the target's catalog for qa and prod.
    default: freshcart_dev
  catalog:
    description: "This environment's catalog. Set per target below."

  # ---- filled in automatically; no need to touch ----------------------------
  title_suffix:
    description: "Appended to space_title so environments can't be confused."
    default: ""
  warehouse_id:
    description: "Resolved from warehouse_name in each workspace."
    lookup:
      warehouse: ${var.warehouse_name}

# One catalog per environment. The environments themselves (dev -> qa -> prod) are fixed:
# they are wired into the workflows and the GitHub environment names.
targets:
  dev:
    variables:
      catalog: freshcart_dev
      title_suffix: " [DEV]"
  qa:
    variables:
      catalog: freshcart_qa
      title_suffix: " [QA]"
  prod:
    variables:
      catalog: freshcart
      title_suffix: ""
