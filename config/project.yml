# =============================================================================
# THE ONLY FILE YOU EDIT when you clone this repository for a new Genie space.
# Everything else - workflows, scripts, tests - is the same for every space.
#
# Every value appears exactly once. Fill in the sections marked FILL IN; leave the derived section alone.
#
# After bootstrapping, check it with:  databricks bundle validate -t dev
#
# NOT here, on purpose:
#   * the service principal each environment runs as. That is an identity per environment, not per
#     space, so it lives in GitHub: Settings -> Environments -> dev / qa / prod, as DATABRICKS_CLIENT_ID
#     (and the DATABRICKS_CLIENT_SECRET secret, if you are not using workload identity federation).
#   * grants, group membership and row-filter groups for that principal. See docs/access-and-identity.md.
# =============================================================================

bundle:
  # FILL IN. Unique per space; names the deployment folder and the record Databricks keeps of the
  # adopted space. Changing it later makes the bundle forget that space, so pick it once.
  name: genie-dab-demo

variables:

  # ===========================================================================
  # FILL IN - the space
  # ===========================================================================
  space_title:
    description: "Title of the space. The environment suffix is appended to it."
    default: "FreshCart Sales & Stock Assistant"
  space_description:
    description: "One line, shown under the title in the Genie list."
    default: "Ask about sales, margin, baskets, promotions and stock across FreshCart stores and online."

  # ===========================================================================
  # FILL IN - the data
  # ===========================================================================
  dev_catalog:
    description: >-
      Catalog the dev space reads. Must match the catalog inside src/*.geniespace.json, which is exported
      from dev. It is also the default for every environment, so when each environment has its own
      workspace and the catalog is named the same in all of them, this is the only catalog you set.
    default: freshcart_dev

  # ===========================================================================
  # FILL IN - who can use the space. The groups must already exist in the workspace.
  # Access is applied on EVERY deployment and is exact: whatever these produce becomes the space's
  # access, and anything granted by hand in the Genie UI is removed. That is the point - access is
  # reviewed in git. Workspace admins and the deploying service principal keep access regardless.
  # ===========================================================================
  deployers_group:
    description: "Runs releases; can change the space in any environment."
    default: freshcart-genie-deployers
  editors_group:
    description: "Edits the dev space in the Genie UI. dev only."
    default: freshcart-genie-developers
  readers_group:
    description: "Asks questions. Every environment."
    default: freshcart-business-users

  # ===========================================================================
  # Declared here, given their value per target below.
  # A bundle variable has to be declared before a target can assign it - without these four entries
  # you get "variable <name> is not defined but is assigned a value".
  # ===========================================================================
  warehouse_id:
    description: >-
      SQL warehouse the space runs on. No default on purpose: warehouse ids are workspace-scoped, so
      every environment has its own even when the warehouses are named the same, and inheriting one
      would silently point an environment at another workspace's warehouse. Find each id in the
      warehouse's URL (/sql/warehouses/<id>) or with `databricks warehouses list` against that
      workspace. Use a serverless warehouse: Databricks recommends never Classic or Pro for Genie.
  catalog:
    description: "This environment's catalog. Defaults to dev_catalog; override per target when it differs."
    default: ${var.dev_catalog}
  space_permissions:
    description: "Access in qa and prod. dev adds the editors; see the dev target below."
    type: complex
    default:
      - level: CAN_MANAGE
        group_name: ${var.deployers_group}
      - level: CAN_RUN
        group_name: ${var.readers_group}
  title_suffix:
    description: "Appended to space_title so environments cannot be confused."
    default: ""
  # ===========================================================================
  # Rarely changed
  # ===========================================================================
  deployment_root:
    description: >-
      Parent folder for the bundle's record of the space. Deliberately not under
      /Workspace/Users/<whoever deploys>: the record would then depend on the identity running the
      deploy, and a deploy by anyone else would not find the space and would create a second one.
      Restrict write access on this folder to the deploying service principal.
    default: /Workspace/Applications

# =============================================================================
# FILL IN - one workspace per environment.
#
# `host` is where this environment deploys, and it is AUTHORITATIVE: in CI it takes precedence over
# DATABRICKS_HOST, so a mis-set GitHub variable cannot redirect a deploy into another environment's
# workspace. Locally, a profile for a different workspace is refused outright. The environment's
# credentials must still be valid in the pinned workspace.
#
# A workspace per environment is the stronger isolation and what Databricks recommends; the catalog can
# then be named the same everywhere, so delete the `catalog:` lines below and set only dev_catalog.
# One shared workspace also works: repeat the same host, and keep the different catalogs and suffixes.
# Delete the `workspace:` blocks entirely to take the host only from DATABRICKS_HOST.
#
# The environments themselves (dev -> qa -> prod) are fixed: they are wired into the workflows and must
# match the GitHub environment names.
# =============================================================================
targets:

  dev:
    workspace:
      host: https://dbc-dce5877f-fc61.cloud.databricks.com
    variables:
      warehouse_id: "be6f5ff41b27cf5d"
      title_suffix: " [DEV]"
      # Only dev is editable: that is where the editors work, and the sync exports what they change.
      space_permissions:
        - level: CAN_MANAGE
          group_name: ${var.deployers_group}
        - level: CAN_EDIT
          group_name: ${var.editors_group}
        - level: CAN_RUN
          group_name: ${var.readers_group}

  qa:
    workspace:
      host: https://dbc-dce5877f-fc61.cloud.databricks.com
    variables:
      warehouse_id: "be6f5ff41b27cf5d"
      catalog: freshcart_qa
      title_suffix: " [QA]"

  prod:
    workspace:
      host: https://dbc-dce5877f-fc61.cloud.databricks.com
    variables:
      warehouse_id: "be6f5ff41b27cf5d"
      catalog: freshcart
