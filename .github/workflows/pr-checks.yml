# Checks on every pull request into main. Make "format" and "validate" required checks (branch protection),
# so nothing broken can be merged. For the dev-sync pull request, the benchmarks also run on the dev space,
# which holds exactly the pull request's content, so the reviewer sees the accuracy before merging.
name: "PR checks"

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml
      - name: Is the space bootstrapped?
        id: ready
        run: |
          if [ -f src/genie_space.geniespace.json ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not bootstrapped yet (run the workflow '1 · Bootstrap'): nothing to check."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Space JSON checks
        if: steps.ready.outputs.ok == 'true'
        run: python scripts/check_space.py
      - name: What this pull request changes
        if: steps.ready.outputs.ok == 'true'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git show "origin/$BASE:src/genie_space.geniespace.json" > "$RUNNER_TEMP/base.json" 2> /dev/null || : > "$RUNNER_TEMP/base.json"
          { echo "### What changes in the Genie space"; echo
            python scripts/describe_changes.py "$RUNNER_TEMP/base.json" src/genie_space.geniespace.json; } >> "$GITHUB_STEP_SUMMARY"

  validate:
    name: validate
    runs-on: ubuntu-latest
    environment: dev
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST || secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID || secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DATABRICKS_AUTH_TYPE: ${{ secrets.DATABRICKS_CLIENT_SECRET != '' && 'oauth-m2m' || 'github-oidc' }}
      TARGET_ENV: dev
    steps:
      - uses: actions/checkout@v5
      - name: Is the space bootstrapped?
        id: ready
        run: |
          if [ -f src/genie_space.geniespace.json ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not bootstrapped yet (run the workflow '1 · Bootstrap'): nothing to check."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check the Databricks settings
        if: steps.ready.outputs.ok == 'true'
        run: bash scripts/check_settings.sh
      - uses: databricks/setup-cli@v1.20.0
        if: steps.ready.outputs.ok == 'true'
      - name: bundle validate (dev)
        if: steps.ready.outputs.ok == 'true'
        run: databricks bundle validate -t dev

  dev-benchmarks:
    name: dev benchmarks
    if: github.head_ref == 'genie/dev-sync'
    needs: [format, validate]
    runs-on: ubuntu-latest
    environment: dev
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST || secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID || secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DATABRICKS_AUTH_TYPE: ${{ secrets.DATABRICKS_CLIENT_SECRET != '' && 'oauth-m2m' || 'github-oidc' }}
      TARGET_ENV: dev
      ACCURACY_THRESHOLD: ${{ vars.ACCURACY_THRESHOLD || '0.80' }}
    steps:
      - uses: actions/checkout@v5
      - name: Check the Databricks settings
        run: bash scripts/check_settings.sh
      - uses: databricks/setup-cli@v1.20.0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet databricks-sdk pyyaml
      - name: Does the dev space still hold exactly this pull request?
        id: live
        run: |
          databricks bundle plan -t dev -o json > "$RUNNER_TEMP/plan.json"
          python scripts/deploy_guard.py "$RUNNER_TEMP/plan.json" --live-matches
      - name: Benchmarks on the dev space
        if: steps.live.outputs.matches == 'true'
        run: |
          export GENIE_SPACE_ID=$(databricks bundle summary -t dev -o json | jq -r '.resources.genie_spaces.genie_space.id')
          python tests/benchmark_gate.py
