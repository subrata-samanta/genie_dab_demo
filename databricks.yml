# =============================================================================
# Genie space as code: one JSON file, one resource, promoted dev -> qa -> prod by GitHub Actions
# with `databricks bundle deploy`.
#
# THIS FILE IS THE SAME FOR EVERY SPACE - there is nothing to edit here.
# Everything specific to a space lives in config/project.yml.
#
#   config/project.yml                   name, title, warehouse, catalogs   <- edit this
#   resources/genie_space.genie_space.yml the resource, built from those variables
#   src/genie_space.geniespace.json       the space's content, exported from the dev space
#
# Genie spaces need the direct deploy engine (the Terraform engine is NOT supported).
# Authentication is not configured here: GitHub Actions provides DATABRICKS_HOST / DATABRICKS_CLIENT_ID /
# DATABRICKS_CLIENT_SECRET per GitHub environment (see README.md).
# =============================================================================

bundle:
  engine: direct
  databricks_cli_version: ">= 1.14.0"

include:
  - config/*.yml
  - resources/*.yml

# The promotion path. Catalogs and titles come from config/project.yml; these targets only say
# how and where each environment is deployed, which is the same for every space.
targets:
  dev:
    default: true
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

  qa:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
