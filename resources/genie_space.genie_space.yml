# The Genie space. Its content (data sources, instructions, example SQL, benchmarks...) is the JSON file,
# which the workflows write: never edit it by hand while editors are working in the dev UI.
#
# This file has the name `bundle generate genie-space --key genie_space` writes, so the bootstrap workflow
# can export the existing space and then put this version back.
resources:
  genie_spaces:
    genie_space:
      title: "${var.space_title}${var.title_suffix}"
      description: ${var.space_description}
      file_path: ../src/genie_space.geniespace.json
      warehouse_id: ${var.warehouse_id}
      # No `permissions:` for now: the bundle leaves the space's sharing alone (share QA and prod by hand,
      # like any Genie space). To manage access as code later, add for example:
      #   permissions:
      #     - level: CAN_RUN
      #       group_name: <group of the business users>
      #     - level: CAN_EDIT          # dev only, via a variable per target
      #       group_name: <group of the editors>
      # Deploying then sets exactly these permissions, so the groups must exist first.
